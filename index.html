<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Caneca Inteligente</title>
    <link rel="stylesheet" href="lo.css">
</head>
<body>

    <div class="contenedor">
        <h1>Simulador de Caneca Inteligente</h1>
        <p>Simulación de residuos plásticos generados durante el <strong>descanso escolar</strong>.</p>

        <!-- Panel de Ajuste de Parámetros -->
        <div class="panel">
            <h2>Datos del descanso</h2>
            <div class="datos">
                <div class="dato">
                    <label for="estudiantes">Estudiantes</label>
                    <input type="number" id="estudiantes" value="700">
                </div>
                <div class="dato">
                    <label for="tiempo">Tiempo del descanso (min)</label>
                    <input type="number" id="tiempo" value="30">
                </div>
                <div class="dato">
                    <label for="empaques">Empaqués por estudiante</label>
                    <input type="number" id="empaques" value="1">
                </div>
                <div class="dato">
                    <label for="pesoEmpaque">Peso por empaque (kg)</label>
                    <input type="number" id="pesoEmpaque" value="0.04" step="0.01">
                </div>
                <div class="dato">
                    <label for="capacidad">Capacidad caneca (kg)</label>
                    <input type="number" id="capacidad" value="30">
                </div>
            </div>
            
            <div class="botones">
                <button onclick="iniciar()">Iniciar</button>
                <button onclick="pausar()">Pausar</button>
                <button onclick="reiniciar()">Reiniciar</button>
            </div>
        </div>

        <!-- Panel Visual de la Caneca -->
        <div class="panel">
            <h2>Caneca durante el descanso</h2>
            <div class="tapa"></div>
            <div class="caneca">
                <div id="basura" class="basura"></div>
            </div>
            <div id="porcentaje" class="porcentaje">0%</div>
            <div id="mensaje">Caneca disponible</div>
            <div class="barra-tiempo">
                <div id="progreso"></div>
            </div>
        </div>

        <!-- Panel de Reporte en Tiempo Real -->
        <div class="panel">
            <h2>Información de la simulación</h2>
            <div class="estadisticas">
                <div class="tarjeta">Tiempo: <strong id="tiempoActual">0 min</strong></div>
                <div class="tarjeta">Estudiantes: <strong id="mostrarEstudiantes">700</strong></div>
                <div class="tarjeta">Empaques: <strong id="totalEmpaques">0</strong></div>
                <div class="tarjeta">Peso: <strong id="pesoActual">0 kg</strong></div>
            </div>
        </div>
    </div>

    <!-- Vinculación del comportamiento -->
    <script src="lo.js"></script>
</body>
</html>
